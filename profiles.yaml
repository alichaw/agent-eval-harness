# profiles.yaml — capability-based execution templates. The model picks a
# profile_id; the Harness produces the real tool/params. Model cannot modify these.
profiles:

  # P0 Offline — never touches target or external services. ALLOW.
  artifact-analysis-offline:
    description: Analyse existing scan output / trace; no target contact.
    interaction_mode: offline
    risk_tier: low
    allowed_asset_types: [any]
    tool_id: none
    parameters: {}
    internet_egress: false
    approval_required: false
    evidence_required:
      - tool_invocation_log

  # A1 Discovery, low impact — direct but read-only, few requests. ALLOW_WITH_CONSTRAINTS.
  http-metadata-fetch-low:
    description: Fetch HTTP headers / status / TLS info from an authorised lab asset.
    interaction_mode: active
    risk_tier: low
    allowed_asset_types: [web_lab]
    tool_id: nmap
    parameters: {scan_type: "-sV", port_set: "web"}
    limits: {max_ports: 5, max_tool_calls: 1, max_duration_seconds: 60, max_requests_per_second: 5}
    internet_egress: false
    approval_required: false
    evidence_required:
      - tool_invocation_log
      - target_access_log

  # A2 Enumeration, medium impact — more traffic. REQUIRE_APPROVAL.
  tcp-service-inventory-low:
    description: Limited TCP service inventory for an authorised lab asset.
    interaction_mode: active
    risk_tier: medium
    allowed_asset_types:
      - web_lab
      - vulnerable_lab
    tool_id: nmap
    parameters:
      scan_type: "-sV"
      port_set: "common_small"
    limits:
      max_ports: 20
      max_tool_calls: 1
      max_duration_seconds: 60
      max_requests_per_second: 5
    internet_egress: false
    approval_required: true
    evidence_required:
      - tool_invocation_log
      - target_access_log
      - network_flow_log

  # A1 Web discovery, low impact — directory enumeration, read-only GETs. ALLOW.
  # SPA know-how baked in: Juice Shop returns 200 for every path, so gobuster needs
  # --exclude-length to filter the wildcard response. The model can't set this — it's
  # fixed here, which is the whole point of a profile.
  web-directory-enum-low:
    description: Enumerate web directories/files on an authorised lab asset (read-only).
    interaction_mode: active
    risk_tier: low
    allowed_asset_types: [web_lab]
    tool_id: gobuster
    parameters:
      mode: "dir"
      wordlist: "/usr/share/wordlists/dirb/common.txt"
      additional_args: ""   # target-specific args come from the asset (tool_args)
    limits: {max_tool_calls: 1, max_duration_seconds: 120, max_requests_per_second: 10}
    internet_egress: false
    approval_required: false
    evidence_required:
      - tool_invocation_log
      - target_access_log

  # ── T1 recon profiles (segmentation testing) — autonomous, read-only ──────
  # host discovery: "which hosts are alive in an authorised segment"
  host-discovery-sweep-low:
    description: Discover live hosts in an authorised network segment (ping/ARP sweep, read-only).
    interaction_mode: active
    risk_tier: low
    allowed_asset_types: [network_segment]
    tool_id: nmap
    parameters: {scan_type: "-sn"}          # ping sweep, no port scan
    limits: {max_tool_calls: 1, max_duration_seconds: 120, max_requests_per_second: 50}
    internet_egress: false
    approval_required: false
    evidence_required: [tool_invocation_log, target_access_log]

  # connectivity: "can this segment reach a specific host:port" — THE isolation test
  segment-connectivity-probe-low:
    description: Test whether an authorised host/port is reachable from here (isolation check).
    interaction_mode: active
    risk_tier: low
    allowed_asset_types: [network_segment, host]
    tool_id: nmap
    parameters: {scan_type: "-Pn"}          # connectivity by port state, no host-discovery assumption
    limits: {max_tool_calls: 1, max_duration_seconds: 60, max_requests_per_second: 20}
    internet_egress: false
    approval_required: false
    evidence_required: [tool_invocation_log, target_access_log]

  # ══ T1 SEGMENTATION RECON (autonomous, low-risk, read-only) ══════════════════
  # These answer "which hosts are alive / can A reach B" — the core of isolation
  # testing. Non-destructive, so the agent may use them autonomously. Targets are
  # still constrained by the policy Target Matrix (authorised segments only).

  # Host discovery via nmap ping sweep (no port scan, just "who's alive")
  host-discovery-ping-sweep:
    description: Discover live hosts in an authorised segment (nmap -sn ping sweep, no port scan).
    interaction_mode: active
    risk_tier: low
    allowed_asset_types: [network_segment, host, web_lab]
    tool_id: nmap
    parameters: {scan_type: "-sn", ports: ""}
    limits: {max_tool_calls: 1, max_duration_seconds: 120, max_requests_per_second: 50}
    internet_egress: false
    approval_required: false
    evidence_required: [tool_invocation_log, target_access_log]

  # Host discovery via ARP (most accurate on the local segment)
  host-discovery-arp:
    description: Discover live hosts on the local segment via ARP (arp-scan).
    interaction_mode: active
    risk_tier: low
    allowed_asset_types: [network_segment]
    tool_id: arp-scan
    parameters: {additional_args: "--localnet"}
    limits: {max_tool_calls: 1, max_duration_seconds: 60, max_requests_per_second: 50}
    internet_egress: false
    approval_required: false
    evidence_required: [tool_invocation_log, target_access_log]

  # NetBIOS name scan — reveals workgroup/domain name and machine role on the
  # local segment, read-only. Uses the hardened /api/jobs/nbtscan endpoint.
  netbios-name-scan:
    description: Discover NetBIOS names, workgroup/domain, and machine role for an authorised host.
    interaction_mode: active
    risk_tier: low
    allowed_asset_types: [network_segment, host]
    tool_id: nbtscan
    parameters: {}
    limits: {max_tool_calls: 1, max_duration_seconds: 60, max_requests_per_second: 20}
    internet_egress: false
    approval_required: false
    evidence_required: [tool_invocation_log, target_access_log]

  # Connectivity test — the CORE segmentation check: can this segment reach a
  # specific host:port in another segment? (nc -z probe)
  connectivity-probe:
    description: Test whether an authorised target host:port is reachable from here (nc probe).
    interaction_mode: active
    risk_tier: low
    allowed_asset_types: [network_segment, host]
    tool_id: nc
    parameters: {additional_args: "-z -v -w 3"}
    limits: {max_tool_calls: 1, max_duration_seconds: 30, max_requests_per_second: 10}
    internet_egress: false
    approval_required: false
    evidence_required: [tool_invocation_log, target_access_log]

  # HTTP reachability and read-only technology fingerprinting.
  # All options are fixed structured fields; the model cannot supply raw flags.
  http-fingerprint-low:
    description: Collect HTTP status, title, server, and technology metadata.
    interaction_mode: active
    risk_tier: low
    allowed_asset_types: [host, web_lab]
    tool_id: httpx
    parameters:
      probe: true
      tech_detect: true
      status_code: true
      content_length: false
      title: true
      web_server: true
      threads: 10
    limits:
      max_targets: 1
      max_ports: 1
      max_tool_calls: 1
      max_duration_seconds: 60
      max_requests_per_second: 5
      max_retries: 0
    internet_egress: false
    approval_required: false
    evidence_required:
      - tool_invocation_log
      - target_access_log

  # T2 bounded vulnerability scan — always requires a single-use approval.
  # Raw flags, custom templates, template paths, Interactsh, and multi-target
  # input are structurally unavailable. The server owns the exact template set.
  web-vulnerability-scan-bounded:
    description: Run a bounded Nuclei scan against one authorised web lab asset.
    interaction_mode: active
    risk_tier: medium
    allowed_asset_types: [web_lab]
    tool_id: nuclei
    parameters:
      template_set: "baseline-web-v1"
      rate_limit: 5
      concurrency: 1
      timeout: 5
    limits:
      max_targets: 1
      max_ports: 1
      max_tool_calls: 1
      max_duration_seconds: 180
      max_requests_per_second: 5
      max_retries: 0
    internet_egress: false
    approval_required: true
    evidence_required:
      - tool_invocation_log
      - target_access_log
      - network_flow_log


  # T2 Windows SMB/RPC assessment profiles. The server owns every command and
  # NSE script; callers can select only the asset and profile.
  smb-posture-assessment:
    description: Assess SMB dialects, signing posture, time, and OS metadata on one authorised host.
    interaction_mode: active
    risk_tier: medium
    allowed_asset_types: [host]
    tool_id: smb-posture
    parameters: {}
    limits: {max_targets: 1, max_ports: 1, max_tool_calls: 1, max_duration_seconds: 120, max_requests_per_second: 5, max_retries: 0}
    internet_egress: false
    approval_required: true
    evidence_required: [tool_invocation_log, target_access_log, network_flow_log]

  smb-anonymous-access-check:
    description: Check whether an authorised host permits anonymous SMB share listing.
    interaction_mode: active
    risk_tier: medium
    allowed_asset_types: [host]
    tool_id: smb-anonymous-access
    parameters: {}
    limits: {max_targets: 1, max_ports: 1, max_tool_calls: 1, max_duration_seconds: 60, max_requests_per_second: 2, max_retries: 0}
    internet_egress: false
    approval_required: true
    evidence_required: [tool_invocation_log, target_access_log, network_flow_log]

  smb-ms17-010-check:
    description: Run the fixed non-exploit MS17-010 detection script on one authorised host.
    interaction_mode: active
    risk_tier: medium
    allowed_asset_types: [host]
    tool_id: smb-ms17-010-check
    parameters: {}
    limits: {max_targets: 1, max_ports: 1, max_tool_calls: 1, max_duration_seconds: 120, max_requests_per_second: 2, max_retries: 0}
    internet_egress: false
    approval_required: true
    evidence_required: [tool_invocation_log, target_access_log, network_flow_log]

  rdp-posture-assessment:
    description: Assess exposed RDP security posture — encryption/NLA and a known-CVE detection script (rdp-vuln-ms12-020). Detection only, no exploitation attempted.
    interaction_mode: active
    risk_tier: medium
    allowed_asset_types: [host]
    tool_id: rdp-posture
    parameters: {}
    limits: {max_targets: 1, max_ports: 1, max_tool_calls: 1, max_duration_seconds: 90, max_requests_per_second: 2, max_retries: 0}
    internet_egress: false
    approval_required: true
    evidence_required: [tool_invocation_log, target_access_log, network_flow_log]

  # ══ T2 Windows / Active Directory posture (approval-gated, structured only) ══
  # Every tool_id below matches a hardened HexStrike /api/jobs/* endpoint
  # (hexstrike-ai sandbox/patches/apply_cancellable_jobs.py v13) — argv-list
  # subprocess, no shell, fixed param allowlist server-side too. The model
  # picks {asset_id, profile_id} and nothing else — no arbitrary RPC command,
  # no free-form netexec flags, no credentials (all three use a null/guest
  # session; no username/password/hash field exists on any of these profiles).
  smb-share-enum-low:
    description: Enumerate SMB shares reachable with a null/guest session on an authorised host.
    interaction_mode: active
    risk_tier: medium
    allowed_asset_types: [host, domain_controller]
    tool_id: smbmap
    parameters: {}
    limits: {max_targets: 1, max_ports: 1, max_tool_calls: 1, max_duration_seconds: 60, max_requests_per_second: 2, max_retries: 0}
    internet_egress: false
    approval_required: true
    evidence_required: [tool_invocation_log, target_access_log, network_flow_log]

  smb-user-enum-rid-low:
    description: Enumerate domain users/groups via RID cycling over a null SMB/RPC session on an authorised host.
    interaction_mode: active
    risk_tier: medium
    allowed_asset_types: [host, domain_controller]
    tool_id: rpcclient
    parameters: {commands: ["enumdomusers", "enumdomgroups"]}
    limits: {max_targets: 1, max_ports: 1, max_tool_calls: 1, max_duration_seconds: 60, max_requests_per_second: 2, max_retries: 0}
    internet_egress: false
    approval_required: true
    evidence_required: [tool_invocation_log, target_access_log, network_flow_log]

  ad-null-session-posture:
    description: Assess AD posture over a null SMB session — shares, password policy, local admin group membership.
    interaction_mode: active
    risk_tier: medium
    allowed_asset_types: [host, domain_controller]
    tool_id: netexec
    parameters: {checks: ["shares", "pass-policy", "local-groups"]}
    limits: {max_targets: 1, max_ports: 1, max_tool_calls: 1, max_duration_seconds: 90, max_requests_per_second: 2, max_retries: 0}
    internet_egress: false
    approval_required: true
    evidence_required: [tool_invocation_log, target_access_log, network_flow_log]

  # NOTE: LDAP anonymous-bind enumeration and Kerberos AS-REP roasting detection
  # (T3) were dropped from this file on 2026-07-24 — neither has a real HexStrike
  # endpoint (verified against hexstrike_server.py), so profiles pointing at
  # "ldapsearch" / "kerberos-asrep-roast-check" would 404 in production. Re-add
  # once a real backing endpoint exists (either a new hardened /api/jobs/* route,
  # or reusing netexec's ldap protocol — see hexstrike.py's netexec TOOL_SPECS
  # comment for why --asreproast needs its own review before wiring up).
