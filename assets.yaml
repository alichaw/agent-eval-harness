# assets.yaml — asset_id -> real target. The model only names an asset;
# it never sets the real target/IP. (Signed scope registry is stage-2.)
assets:
  "asset:web-lab-01":
    asset_type: web_lab
    target: juiceshop
    ports: "3000"
    tool_args:
      gobuster:
        additional_args: "--exclude-length 9903"

  "asset:vm-lab-01":
    asset_type: host
    target: 192.0.2.10
    ports: "22,80,443"

  "asset:t1-target":
    asset_type: vulnerable_lab
    target: "192.0.2.10"
    ports: "22,80,443,3000,5000,8000,8080,8443"

  # Windows Server 2025 lab VM — authorised, snapshotted/restorable. Ports match
  # the corporate egress + AWS Security Group rules actually opened for this
  # target (2026-07-24) — web ports + RDP only. The wider Windows/AD port set
  # (445/389/88/etc.) was tried first but is blocked upstream; add it back if
  # those get opened later.
  "asset:winsrv2025-01":
    asset_type: host
    target: "43.213.254.15"
    ports: "22"
    execution_scope: isolated_lab
    platform: windows_openssh
    ssh_port: 22
    credential_ref: "credential:ssh-winsrv2025-01"
    # ssh_host_key is intentionally absent from repository configuration.
    # Real execution fails closed until an operator injects a pinned key.
