# policy.yaml — production-grade, default-deny.
# Configured for internal network SEGMENTATION TESTING (T1 recon + T2 scan + T3 access).
default: deny

# ── Tool allowlist by tier (see 05_capability_authorization_model.md) ────────
# T1 recon (autonomous) + T2 scan (approval) + T3 access/lateral (time-delayed
# approval) are enforced below via allowed_tools/active_tools/t3_low/t3_high.
# T3 tools require hardened /api/jobs/* endpoints and credential handling.
# Every T1/T2 tool below has a matching hardened HexStrike job endpoint
# (sandbox/patches/apply_cancellable_jobs.py in the hexstrike-ai repo), EXCEPT
# arp-scan/nc — see the active_tools note.
#
# Trimmed 2026-07-27: netdiscover, traceroute, tcptraceroute, whatweb, masscan,
# nikto, snmp-check, smbclient, ffuf, feroxbuster had no entry at all in
# core/adapters/hexstrike.py's TOOL_SPECS — calling them raised "unsupported
# tool" client-side before any request was ever sent. Not a security issue,
# just dead config; removed rather than left to bit-rot. Re-add once each has
# a real TOOL_SPECS entry AND (for T2 ones) a hardened /api/jobs/* endpoint.
allowed_tools:
  # T1 · recon (low risk, autonomous) — hardened /api/jobs/* endpoint
  - nmap
  - httpx
  - nbtscan
  # T2 · scan / enum (allowed but require approval — see active_tools)
  - nuclei
  - smb-posture
  - smb-anonymous-access
  - smb-ms17-010-check
  - rdp-posture
  - smbmap
  - rpcclient
  - netexec
  - gobuster
  # arp-scan / nc: TOOL_SPECS exists in hexstrike.py but neither is in the
  # adapter's hardened-job tool set (core/adapters/hexstrike.py, the
  # `tool in {...}` check gating _run_cancellable_job) — calls fall through to
  # the legacy, PRE-hardening /api/tools/* endpoint: no target-matrix check, no
  # capability token, no approval gate, no cancellation. Kept allowed (they're
  # genuinely low-risk recon) but moved to active_tools below so a human signs
  # off each use until they're wired into /api/jobs/* like everything else.
  - arp-scan
  - nc
  # T3-Low · access/pivoting (approval-gated with 900s delay)
  - ssh-port-forward
  - chisel
  - ligolo-ng
  - proxychains
  - powerview
  - powerup
  - seatbelt
  - winpeas
  - bloodhound
  - sharphound
  - netexec-authenticated
  # T3-High · credential extraction (approval-gated with 3600s delay + written justification)
  - impacket-secretsdump
  - impacket-wmiexec
  - impacket-psexec
  - impacket-smbexec
  - mimikatz
  - rubeus
  - evil-winrm
  - hydra
  - medusa
  - patator
  - responder

# T2 active/intrusive tools: allowed but REQUIRE_APPROVAL before executing.
active_tools:
  - nuclei
  - smb-posture
  - smb-anonymous-access
  - smb-ms17-010-check
  - rdp-posture
  - smbmap
  - rpcclient
  - netexec       # near-high-risk SMB/AD enumeration
  - gobuster
  - arp-scan      # legacy unhardened /api/tools/* path — see allowed_tools note
  - nc            # legacy unhardened /api/tools/* path — see allowed_tools note
  # NOTE: a full nmap -sV/-sC/-p- is active too; low-impact nmap -sn stays autonomous.
  # Tier is decided by PROFILE, so the same nmap binary is T1 (ping sweep) or T2 (deep scan).

# ── Target Matrix ────────────────────────────────────────────────────────────
# ONLY manager-authorised segments (from the WRITTEN scope). Replace the examples
# with the real authorised ranges before any internal run.
allowed_targets:
  - juiceshop
  - 192.0.2.10/32     # asset:t1-target — renamed from the old docker-hostname entry
  - 192.0.2.10/32
  - 43.213.254.15/32     # asset:winsrv2025-01 — Windows Server 2025 lab VM
  # - 10.20.0.0/24         # authorised test VLAN        (example — replace)
  # - 10.20.1.0/24         # authorised endpoint segment (example — replace)

# ── HARD EXCLUSIONS — checked FIRST, win over allowed_targets ────────────────
# A target matching any of these is REFUSED even if it also falls inside an
# authorised segment. Production, OT, and other teams must NEVER be scanned.
# Fill from the authorised scope's exclusion list.
denied_targets: []
  # - 10.0.0.0/24          # production servers — NEVER   (example)
  # - 10.99.0.0/16         # OT / ICS — NEVER             (example)
  # - 10.50.0.0/16         # other department — NEVER     (example)

# Dedicated Controller route only; no generic executable profile/tool is exposed.
t3_allowed_capabilities:
  - t3-access-bounded
  - t3-authorized-access-bounded
  - windows-host-enumeration-readonly
t3_allowed_stages:
  - initial_access
  - authorized_access
  - windows_enumeration

max_cost_usd: 1.0

# extra blacklist layer (on top of the allowlist) — block exploit/vuln scripts
deny_flags:
  nmap:
    - "--script=exploit"
    - "--script=vuln"
  # sqlmap dump/shell are blocked here too, in case a T2 sqlmap profile is ever added
  sqlmap:
    - "--dump"
    - "--os-shell"
    - "--os-pwn"

# ══════════════════════════════════════════════════════════════════════════
# T3 — access / lateral movement (WRITTEN SCOPE ONLY — 2026-07-27 draft)
#
# NOT enforced by core/policy.py: Policy.from_yaml() only reads allowed_tools/
# allowed_targets/active_tools/denied_targets/max_cost_usd/deny_flags. These
# two lists are inert until someone (a) adds gate logic for them, AND
# (b) each tool gets a real hardened /api/jobs/* endpoint + TOOL_SPECS entry +
# profile, the same way the T1/T2 tools above did. Until then the agent has
# NO CAPABILITY to invoke anything listed here, same as before this section
# existed — writing it down is the first step of the change process, not the
# last.
#
# Both tiers require a time-delayed approval (core/safety.py issue(...,
# delay_seconds=...)) — the approval exists/is logged the moment it's minted,
# but cannot be consumed until the cooling-off window elapses. This is the
# single-operator substitute for two-person review: it forces a gap between
# deciding to act and being able to act.
#
# Credential handling (applies to every tool below): never in a case file,
# CLI argument, or chat/log text. Store as an independent 0600 file (same
# pattern as config/local/job-create.token); an approval references WHICH
# credential set to use, never the plaintext. Any tool output containing a
# credential, hash, or ticket must be redacted before it reaches trace.jsonl
# or runs/ (core/redaction.py) — see T3-High.
# ══════════════════════════════════════════════════════════════════════════

# T3-Low: establish a channel through an already-authorised host + enumerate.
# No credential material is EXTRACTED at this tier (only used to open a
# session) and no target outside allowed_targets is ever touched, even if
# reachable through the tunnel -- a host found via pivot must be added to
# allowed_targets before anything may target it.
t3_low:
  tools:
    - ssh-port-forward     # `ssh -L`/`-D` — the tunnel itself
    - chisel
    - ligolo-ng
    - proxychains
    - powerview            # local/AD enumeration via PowerShell
    - powerup
    - seatbelt
    - winpeas
    - bloodhound
    - sharphound
    - netexec-authenticated # netexec with real creds, distinct from the
                            # existing null-session netexec profile
  approval:
    delay_seconds_min: 900   # 15 min cooling-off, minimum
  evidence_required:
    - tool_invocation_log
    - target_access_log
    - network_flow_log
    - credential_reference_log   # WHICH credential set was used, never the value

# T3-High: credential extraction / lateral movement / password guessing.
# Output at this tier is itself the sensitive artifact (plaintext passwords,
# Kerberos tickets, NTLM hashes) -- redaction is not optional, and every use
# needs a human-written justification, not just a token.
t3_high:
  tools:
    - impacket-secretsdump
    - impacket-wmiexec
    - impacket-psexec
    - impacket-smbexec
    - mimikatz
    - rubeus
    - evil-winrm
    - hydra
    - medusa
    - patator
    # responder: LLMNR/NBT-NS poisoning. NOT a single-target tool -- it answers
    # broadcast traffic from ANY host on the local segment, so the "one /32
    # target" model this whole policy is built on does not apply to it. Needs
    # its own scoping primitive (which broadcast domain/VLAN, not which host)
    # before it can even be expressed here correctly. Listed for visibility;
    # treat as blocked until that's designed, not just approval-gated.
    - responder
  approval:
    delay_seconds_min: 3600   # 1 hour cooling-off, minimum
  output_handling:
    redact_before_trace: true      # credentials/hashes/tickets never hit trace.jsonl or runs/ in the clear
    storage: "separate encrypted-at-rest location, not runs/"
    retention: "explicit deletion policy required before first use"
  evidence_required:
    - tool_invocation_log
    - target_access_log
    - network_flow_log
    - credential_reference_log
    - written_justification   # human-authored, not a token: what/why for this specific use
